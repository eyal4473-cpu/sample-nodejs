replicaCount: 4

image:
  repository: ghcr.io/eyal4473-cpu/sample-nodejs
  tag: "1.0.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: sample.local
  path: /
  annotations: {}

config:
  port: "8080"

secret:
  appToken: "replace-me"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
